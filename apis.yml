name: Distelli
description: >-
  Distelli was a Seattle-based DevOps and application-deployment company founded
  in 2013 by Rahul Singh and backed by Andreessen Horowitz (a16z). It offered a
  SaaS platform and command-line tooling for building, deploying, and managing
  applications across servers and cloud infrastructure, later adding a Docker
  container pipeline and a Kubernetes (K8s) dashboard for managing container
  clusters. Puppet acquired Distelli in September 2017 and rebranded its
  products — the VM/CI-CD dashboard became Puppet Pipelines for Applications and
  the Kubernetes dashboard became Puppet Pipelines for Containers. The
  standalone Distelli company, product, and API no longer operate: the
  distelli.com domain is parked and the Distelli GitHub organization is archived
  and explicitly "no longer supported nor actively maintained." This profile is
  retained as a historical portfolio-company record (a16z) in the API Evangelist
  network.
